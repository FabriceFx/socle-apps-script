name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  bancs:
    name: Bancs du socle et des outils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
